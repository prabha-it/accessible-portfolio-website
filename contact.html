<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Personal portfolio website of Anantha.">

  <meta name="keywords"
        content="portfolio, web developer, HTML, CSS">

  <meta name="author"
        content="Anantha">

  <title>Anantha Portfolio</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">
    Skip to Main Content
  </a>

  <!-- Header -->
  <header>

    <h1>Anantha Portfolio</h1>

    <nav aria-label="Primary Navigation">

      <ul>

        <li>
          <a href="index.html">Home</a>
        </li>

        <li>
          <a href="about.html">About</a>
        </li>

        <li>
          <a href="projects.html">Projects</a>
        </li>

        <li>
          <a href="contact.html">Contact</a>
        </li>

      </ul>

    </nav>

  </header>

  <!-- Main -->
 
  <main id="main-content">

  <section>

    <h2>Contact Me</h2>

    <form>

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        name="name"
        required
        aria-required="true"
      >

      <br><br>

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        name="email"
        required
        aria-required="true"
      >

      <br><br>

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        name="message"
        rows="5"
      ></textarea>

      <br><br>

      <button
        type="submit"
        aria-label="Send Message"
      >
        Send
      </button>

    </form>

  </section>

</main>

  <!-- Footer -->
  <footer>

    <p>
      &copy; 2026 Anantha Portfolio
    </p>

  </footer>

</body>

</html>
